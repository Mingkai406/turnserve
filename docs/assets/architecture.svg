<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="344" viewBox="0 0 1100 344" role="img" aria-labelledby="title desc">
<title id="title">TurnServe execution model</title><desc id="desc">Concurrent producers submit to one runtime owner. The scheduler allocates prefill and decode work to llama.cpp. Only completed current generations commit to conversation history.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Menlo,Consolas,monospace}</style>
<rect width="1100" height="344" fill="#ffffff"/>
<text x="32" y="34" font-size="12" fill="#5c6c78" letter-spacing="1.8">TURNSERVE / EXECUTION MODEL</text>
<text x="32" y="76" font-size="27" fill="#172b3a" >Share the model. Keep each conversation intact.</text>
<line x1="32" y1="99" x2="1068" y2="99" stroke="#d7dee3" stroke-width="1" />
<text x="32" y="132" font-size="12" fill="#16786d" class="mono">01</text>
<text x="32" y="163" font-size="21" fill="#172b3a" >Admit</text>
<text x="32" y="191" font-size="14" fill="#172b3a" >Bounded command queue</text>
<text x="32" y="215" font-size="13" fill="#5c6c78" >Submit · cancel · replace</text>
<line x1="32" y1="236" x2="235" y2="236" stroke="#16786d" stroke-width="3" />
<line x1="248" y1="178" x2="284" y2="178" stroke="#5c6c78" stroke-width="1.4" />
<path d="M278 174 L284 178 L278 182" fill="none" stroke="#5c6c78" stroke-width="1.4"/>
<text x="309" y="132" font-size="12" fill="#16786d" class="mono">02</text>
<text x="309" y="163" font-size="21" fill="#172b3a" >Schedule</text>
<text x="309" y="191" font-size="14" fill="#172b3a" >Prefill chunks + decode</text>
<text x="309" y="215" font-size="13" fill="#5c6c78" >Single runtime owner</text>
<line x1="309" y1="236" x2="512" y2="236" stroke="#16786d" stroke-width="3" />
<line x1="525" y1="178" x2="561" y2="178" stroke="#5c6c78" stroke-width="1.4" />
<path d="M555 174 L561 178 L555 182" fill="none" stroke="#5c6c78" stroke-width="1.4"/>
<text x="586" y="132" font-size="12" fill="#16786d" class="mono">03</text>
<text x="586" y="163" font-size="21" fill="#172b3a" >Execute</text>
<text x="586" y="191" font-size="14" fill="#172b3a" >llama.cpp / model weights</text>
<text x="586" y="215" font-size="13" fill="#5c6c78" >Independent sequence state</text>
<line x1="586" y1="236" x2="789" y2="236" stroke="#16786d" stroke-width="3" />
<line x1="802" y1="178" x2="838" y2="178" stroke="#5c6c78" stroke-width="1.4" />
<path d="M832 174 L838 178 L832 182" fill="none" stroke="#5c6c78" stroke-width="1.4"/>
<text x="863" y="132" font-size="12" fill="#16786d" class="mono">04</text>
<text x="863" y="163" font-size="21" fill="#172b3a" >Commit</text>
<text x="863" y="191" font-size="14" fill="#172b3a" >Current generation only</text>
<text x="863" y="215" font-size="13" fill="#5c6c78" >Completed turns → history</text>
<line x1="863" y1="236" x2="1066" y2="236" stroke="#16786d" stroke-width="3" />
<line x1="32" y1="267" x2="1068" y2="267" stroke="#d7dee3" stroke-width="1" />
<text x="32" y="296" font-size="11" fill="#ba5934" letter-spacing="1.2">CANCEL BOUNDARY</text>
<text x="222" y="296" font-size="15" fill="#172b3a" >An in-flight batch may finish. An acknowledged cancellation cannot commit.</text>
<text x="32" y="326" font-size="12" fill="#5c6c78" >Architecture schematic · v0.1 · single machine, CPU reference backend</text>
</svg>